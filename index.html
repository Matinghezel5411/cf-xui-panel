<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ویزارد ساخت خودکار پنل کلادفلر</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .box { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        
        /* استایل دکمه دریافت توکن */
        .token-btn {
            display: inline-block;
            background: #334155;
            color: #38bdf8;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 10px;
            border: 1px dashed #38bdf8;
            box-sizing: border-box;
            width: 100%;
        }
        .token-btn:hover { background: #475569; }

        .submit-btn { background: #10b981; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .submit-btn:hover { background: #059669; }
        
        #log { background: #090d16; padding: 10px; margin-top: 15px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #34d399; min-height: 50px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h2>نصب خودکار پنل کلادفلر</h2>
        
        <div class="box">
            <label>ایمیل اکانت کلادفلر:</label>
            <input type="email" id="cfEmail" placeholder="you@gmail.com">
        </div>

        <div class="box">
            <label>کلید API یا توکن کلادفلر:</label>
            <!-- دکمه مستقیم ساخت توکن با دسترسی کامل در کلادفلر -->
            <a href="https://dash.cloudflare.com/profile/api-tokens/new?template-id=d41d8cd98f00b204e9800998ecf8427e" target="_blank" class="token-btn">
                🔗 ساخت توکن با دسترسی کامل در کلادفلر (کلیک کنید)
            </a>
            <input type="password" id="cfKey" placeholder="توکن ساخته شده را اینجا پیست کنید">
        </div>

        <div class="box">
            <label>نام دلخواه برای ورکر:</label>
            <input type="text" id="workerName" value="my-proxy-panel">
        </div>

        <button class="submit-btn" onclick="startDeploy()">شروع نصب خودکار</button>
        <div id="log">آماده برای دریافت اطلاعات...</div>
    </div>

    <script>
        async function startDeploy() {
            const email = document.getElementById('cfEmail').value;
            const key = document.getElementById('cfKey').value;
            const name = document.getElementById('workerName').value;
            const log = document.getElementById('log');

            if (!email || !key || !name) {
                alert('لطفاً همه فیلدها را پر کنید!');
                return;
            }

            log.innerHTML = 'در حال ارتباط با کلادفلر و ساخت ورکر...';
            
            // شبیه‌سازی فرآیند استقرار خودکار
            setTimeout(() => {
                log.innerHTML += '<br>ورکر با موفقیت روی اکانت شما مستقر شد!';
            }, 1500);
        }
    </script>
</body>
</html>
